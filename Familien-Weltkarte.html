<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Familien-Weltkarte</title>
<style>
  :root{
    --ocean:#16335c;
    --land:#f3f6fb;
    --border:#9aa7b4;
    --ink:#1f2a36;
    --muted:#6b7886;
    --panel:#ffffff;
    --shadow:0 8px 30px rgba(0,0,0,.35);
    --accent:#2c6fbf;
    --home:#FFC300;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:#05070d;overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#1a3a6b,#05070d);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
  .login-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);width:min(540px,100%);padding:28px;margin:auto}
  .login-card h1{margin:0 0 4px;font-size:24px}
  .login-card p.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
  .userlist{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .user-pick{display:flex;align-items:center;gap:12px;border:1px solid #e3e8ee;border-radius:12px;padding:10px 12px;background:#fafbfc;text-align:left;transition:.15s;width:100%}
  .user-pick:hover{border-color:var(--accent);background:#f2f7fd}
  .swatch{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:2px solid rgba(0,0,0,.15)}
  .user-pick .nm{font-weight:600;font-size:16px;flex:1}
  .user-pick .meta{font-size:12px;color:var(--muted)}
  .iconbtn{border:1px solid #e0e6ec;background:#fff;border-radius:9px;width:34px;height:34px;font-size:15px;line-height:1;color:var(--ink)}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
  .divider{height:1px;background:#eef1f4;margin:18px 0}
  .addrow{display:grid;grid-template-columns:1fr auto;gap:10px}
  input[type=text],input[type=password],input[type=date],textarea{padding:11px 12px;border:1px solid #d7dde4;border-radius:10px;font-size:14px;width:100%;font-family:inherit}
  textarea{resize:vertical;min-height:70px}
  .colorgrid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .colorgrid label{cursor:pointer}
  .colorgrid input{display:none}
  .colorgrid .c{width:28px;height:28px;border-radius:50%;border:3px solid transparent;display:block}
  .colorgrid input:checked + .c{border-color:#1f2a36;transform:scale(1.08)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600}
  .btn.ghost{background:#eef3f8;color:var(--ink)}
  .btn.danger{background:#e54b4b;color:#fff}
  .btn:hover{filter:brightness(.96)}
  .small{font-size:12px;color:var(--muted)}

  /* ---------- Top bar ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:20;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(10,14,22,.82);backdrop-filter:blur(6px);border-bottom:1px solid #1c2533}
  #topbar .me{display:flex;align-items:center;gap:8px;font-weight:600;color:#fff}
  #topbar .grow{flex:1}
  .pill{border:1px solid #2a3647;background:#11161f;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:#dfe6ef}
  .pill:hover{border-color:var(--accent);color:#fff}
  .pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* kein overflow am Balken: sonst klippt er das ⋯-Menü und die Suchergebnisse (man müsste scrollen).
     Die Leiste ist responsiv (Icon-Modus auf schmal), läuft also nicht über. */
  #searchWrap{position:relative;flex:0 0 auto}
  #searchBox{padding:7px 11px;border:1px solid #2a3647;background:#11161f;color:#dfe6ef;border-radius:999px;font-size:13px;width:140px;font-family:inherit}
  #searchBox:focus{outline:none;border-color:var(--accent);width:180px}
  #searchResults{position:absolute;top:115%;left:0;min-width:200px;background:#11161f;border:1px solid #2a3647;border-radius:10px;max-height:260px;overflow:auto;display:none;z-index:25;box-shadow:var(--shadow)}
  #searchResults.open{display:block}
  #searchResults button{display:block;width:100%;text-align:left;background:none;border:none;color:#dfe6ef;padding:9px 12px;font-size:13px;border-bottom:1px solid #1c2533;cursor:pointer}
  #searchResults button:hover{background:#1b2330;color:#fff}
  #moreWrap{position:relative;flex:0 0 auto}
  #moreMenu{position:absolute;top:115%;right:0;min-width:190px;background:#11161f;border:1px solid #2a3647;border-radius:10px;display:none;z-index:26;box-shadow:var(--shadow);overflow:hidden}
  #moreMenu.open{display:block}
  #moreMenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:#dfe6ef;padding:11px 14px;font-size:13px;border-bottom:1px solid #1c2533;cursor:pointer}
  #moreMenu button:last-child{border-bottom:none}
  #moreMenu button:hover{background:#1b2330;color:#fff}
  /* Schmale Viewports (Handy): Pills auf Icons reduzieren, Name/Suche kompakt -> kein horizontales Scrollen */
  @media (max-width:560px){
    #topbar{gap:7px;padding:0 8px}
    #topbar .me .lbl, #meName{display:none}
    .pill .lbl{display:none}
    #searchBox{width:104px}
    #searchBox:focus{width:140px}
  }

  /* ---------- Globe ---------- */
  #mapwrap{position:fixed;inset:56px 0 0 0;background:#03040a;overflow:hidden}
  /* Sternenhimmel: lädt zuerst dein Bild (assets/nebula.*), sonst die SVG, sonst die Verläufe */
  #space{position:absolute;inset:0;z-index:0;pointer-events:none;background-position:center;background-size:cover;background-repeat:no-repeat;}
  #space.fallback{
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 70% 60%, #cfe0ff, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 85% 20%, #ffe9c7, transparent),
      radial-gradient(1px 1px at 55% 15%, #fff, transparent),
      radial-gradient(2px 2px at 30% 65%, #fff, transparent),
      radial-gradient(1px 1px at 90% 75%, #cfe0ff, transparent),
      radial-gradient(1px 1px at 10% 55%, #fff, transparent),
      radial-gradient(1px 1px at 65% 35%, #fff, transparent),
      radial-gradient(1px 1px at 5% 85%, #fff, transparent),
      radial-gradient(1px 1px at 50% 92%, #ffe9c7, transparent),
      radial-gradient(1px 1px at 78% 48%, #fff, transparent),
      radial-gradient(2px 2px at 15% 12%, #fff, transparent),
      radial-gradient(1px 1px at 95% 40%, #fff, transparent),
      radial-gradient(1px 1px at 35% 45%, #cfe0ff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent);
    animation:twinkle 6s ease-in-out infinite alternate;}
  @keyframes twinkle{from{opacity:.55}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){#space.fallback{animation:none}}
  #map{position:relative;z-index:1;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #map.grabbing{cursor:grabbing}
  #map path.country{stroke:var(--border);stroke-width:.4px;cursor:pointer;vector-effect:non-scaling-stroke}
  #map path.country:hover{stroke:#fff;stroke-width:1.1px}
  #map .sphere{fill:var(--ocean)}
  #map .graticule{fill:none;stroke:#2e567f;stroke-width:.4px;opacity:.5}
  #map .glow{fill:none;stroke:#3a6db5;stroke-width:3px;opacity:.4}
  /* Atlas-Look nur im 2D-Karten-Modus */
  #map.atlas .sphere{fill:#add6ec}
  #map.atlas .graticule{stroke:#6fa6c4;opacity:.22}
  #map.atlas path.country{stroke:#7d8a6a;stroke-width:.5px}
  #map .relief{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
  #map .relief.wide{stroke:#b98a55;stroke-width:16px;opacity:.32}
  #map .relief.core{stroke:#7a531f;stroke-width:6px;opacity:.5}
  #map .river{fill:none;stroke:#2f7fcf;stroke-width:1.8px;vector-effect:non-scaling-stroke;opacity:.95;stroke-linecap:round}
  #map .river.on{stroke-width:5px;opacity:1;filter:drop-shadow(0 0 3px #6fc4ff) drop-shadow(0 0 2px #aee0ff)}
  #map .mtn{fill:none;stroke:#7a4f24;stroke-width:1.8px;vector-effect:non-scaling-stroke;opacity:.95;stroke-linecap:round}
  #map .mtn.on{stroke-width:3.8px;opacity:1}
  #map .hit{fill:none;stroke:transparent;stroke-width:18px;vector-effect:non-scaling-stroke;cursor:pointer;pointer-events:stroke}
  #map .peakdot{fill:#7a4f24;stroke:#fff;stroke-width:.7px;pointer-events:none}
  #map .peakhit{fill:transparent;cursor:pointer}
  #map path.country.found{stroke:#ff3b3b;stroke-width:3px}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9fb0c4;font-size:15px;text-align:center}
  #tooltip{position:fixed;z-index:30;pointer-events:none;display:none;background:#0c1422;color:#fff;padding:7px 10px;border-radius:8px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.5);max-width:240px;line-height:1.45;border:1px solid #243349}
  .zoomctl{position:absolute;right:14px;bottom:16px;display:flex;flex-direction:column;gap:6px}
  .zoomctl button{width:40px;height:40px;border-radius:10px;border:1px solid #2a3647;background:#11161f;color:#dfe6ef;font-size:20px;box-shadow:var(--shadow)}
  .hint{position:absolute;left:14px;bottom:16px;background:rgba(12,18,28,.85);border:1px solid #243349;border-radius:10px;padding:8px 11px;font-size:12px;color:#9fb0c4;max-width:280px}
  .hint b{color:#dfe6ef}

  /* ---------- Side panel ---------- */
  #panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:40;background:var(--panel);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
  #panel.open{transform:translateX(0)}
  .panel-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid #eef1f4}
  .panel-head h2{margin:0;font-size:18px;flex:1}
  .panel-body{overflow:auto;padding:16px;flex:1}
  .tabs{display:flex;gap:6px;padding:0 16px;border-bottom:1px solid #eef1f4}
  .tabs button{border:none;background:none;padding:12px 6px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
  .card{border:1px solid #eef1f4;border-radius:14px;padding:14px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .statgrid .s{background:#f6f8fb;border-radius:10px;padding:10px 4px}
  .statgrid .s .n{font-size:22px;font-weight:800}
  .statgrid .s .l{font-size:11px;color:var(--muted)}
  .ach{margin:10px 0}
  .ach .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .ach .top .t{font-weight:600}.ach .top .v{color:var(--muted)}
  .bar{height:9px;background:#eef1f4;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
  .next{font-size:12px;color:var(--muted);margin-top:5px}
  .done{font-size:12px;color:#2e9e5b;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{background:#f2f6fb;border:1px solid #e0e8f0;border-radius:999px;padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip button{border:none;background:none;color:#b33;font-size:15px;line-height:1;padding:0;cursor:pointer}
  .addinline{display:flex;gap:8px;margin-top:6px}
  .addinline input{flex:1}
  .addinline input.emoji{flex:0 0 64px;text-align:center}
  .addinline button{padding:9px 13px;border:none;border-radius:9px;background:var(--accent);color:#fff;font-weight:600}
  .member-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f3f5f8}
  .member-row .nm{font-weight:600;flex:1}
  .member-row .counts{font-size:12px;color:var(--muted)}
  .badgecount{font-size:11px;background:#fff3d6;color:#9a6b00;border-radius:999px;padding:2px 8px;font-weight:700}
  .cov{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .cov .pct{font-size:30px;font-weight:800;line-height:1}
  .contbars .cb{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
  .contbars .cb .lbl{width:86px;color:var(--muted);flex:0 0 auto}
  .contbars .cb .bar{flex:1}
  .contbars .cb .num{width:46px;text-align:right;color:var(--muted);flex:0 0 auto}
  .timeline{position:relative;margin-top:8px;padding-left:18px;border-left:2px solid #e6ebf1}
  .tl{position:relative;padding:6px 0 10px;cursor:pointer}
  .tl:hover .tlname{color:var(--accent)}
  .tldot{position:absolute;left:-25px;top:8px;width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d7dde4}
  .tldate{font-size:12px;color:var(--muted);font-weight:600}
  .tlname{font-weight:600;font-size:14px}
  .tlnote{font-size:12px;color:var(--muted);margin-top:2px}

  /* ---------- Modal ---------- */
  #modal{position:fixed;inset:0;z-index:60;background:rgba(5,7,13,.6);display:none;align-items:center;justify-content:center;padding:18px;overflow:auto}
  #modal.open{display:flex}
  .modal-box{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);max-height:92vh;overflow:auto;padding:22px;margin:auto}
  .modal-box h2{margin:0 0 12px;font-size:20px;display:flex;align-items:center;gap:8px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
  .modal-actions .grow{flex:1}
  .photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .photo{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid #e0e6ec}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:1;cursor:pointer}
  .checkrow{display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:14px}
  .checkrow input{width:18px;height:18px}
  .homechip{font-size:11px;background:#fff3cd;color:#8a6d00;border:1px solid #ffe08a;border-radius:999px;padding:3px 9px;font-weight:700}
  .factbox{background:#f6f8fb;border:1px solid #eef1f4;border-radius:12px;padding:12px 14px;margin-bottom:16px}
  .fact{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:14px;border-bottom:1px solid #edf1f5}
  .fact:last-child{border-bottom:none}
  .fact .fk{color:var(--muted);font-weight:600;white-space:nowrap}
  .fact .fv{text-align:right}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <h1>🌍 Familien-Weltkarte</h1>
    <p class="sub">Wer bist du? Wähle deine Person aus.</p>
    <div class="userlist" id="userlist"></div>
    <div class="divider"></div>
    <p class="small" style="margin:0 0 8px;font-weight:600;color:var(--ink)">Neue Person anlegen</p>
    <div class="addrow">
      <input type="text" id="newName" placeholder="Name (z.B. Emil)" maxlength="24">
      <button class="btn" id="addUserBtn">Hinzufügen</button>
    </div>
    <div class="colorgrid" id="colorgrid"></div>
    <input type="password" id="newPass" placeholder="Passwort (optional)">
  </div>
</div>

<!-- ============ TOP BAR ============ -->
<div id="topbar" style="display:none">
  <div class="me"><span class="swatch" id="meSwatch"></span><span id="meName"></span></div>
  <div id="searchWrap"><input id="searchBox" placeholder="Land suchen…" autocomplete="off"><div id="searchResults"></div></div>
  <div class="grow"></div>
  <button class="pill" id="toggleView" title="Zwischen Globus und Karte umschalten">🗺️ <span class="lbl">Karte</span></button>
  <button class="pill" id="openPanel" title="Daten & Erfolge">📊 <span class="lbl">Daten &amp; Erfolge</span></button>
  <button class="pill" id="switchUser" title="Person wechseln">↺ <span class="lbl">Person wechseln</span></button>
  <!-- "Alle anzeigen" + Sichern/Laden/Einstellungen ins ⋯-Überlaufmenü, damit die Leiste
       auf Tablets/schmalen Viewports nicht horizontal überläuft. -->
  <div id="moreWrap">
    <button class="pill" id="btnMore" title="Mehr">⋯</button>
    <div id="moreMenu">
      <button data-act="all">👨‍👩‍👧 Alle anzeigen</button>
      <button data-act="backup">💾 Sichern</button>
      <button data-act="restore">📂 Laden</button>
      <button data-act="settings">⚙️ Einstellungen</button>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<!-- ============ GLOBE ============ -->
<div id="mapwrap" style="display:none">
  <div id="space" class="fallback"></div>
  <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="loading">Lade Erde …</div>
  <div class="zoomctl">
    <button id="zin">+</button>
    <button id="zout">−</button>
    <button id="zreset" title="Ansicht zurücksetzen">⊙</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div id="tooltip"></div>

<!-- ============ PANEL ============ -->
<div id="panel">
  <div class="panel-head">
    <h2>Daten &amp; Erfolge</h2>
    <button class="pill" id="closePanel">✕</button>
  </div>
  <div class="tabs">
    <button data-tab="me" class="active">Ich</button>
    <button data-tab="family">Familie</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<!-- ============ MODAL ============ -->
<div id="modal"><div class="modal-box" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
/* =================================================================
   Familien-Weltkarte – 3D-Globus, lokale Speicherung im Browser
   ================================================================= */
const STORE_KEY="familienWeltkarte_v3";
const COLORS=["#e6194B","#3cb44b","#4363d8","#f58231","#911eb4","#f032e6","#008080","#9A6324","#800000","#469990","#e6b800","#000075"];
const HOME_DEFAULT="DEU";            // Deutschland (ADM0_A3) als Standard-Heimatland
function homeId(){ return (state.settings&&state.settings.homeId)||HOME_DEFAULT; }   // pro Familie konfigurierbar (Block 5)
const HOME_COLOR=getComputedStyle(document.documentElement).getPropertyValue('--home').trim()||"#FFC300";

const LADDERS={
  countries:{label:"Länder",icon:"🗺️",steps:[[1,"Erster Schritt"],[3,"Reiselust"],[5,"Globetrotter"],[10,"Weltenbummler"],[20,"Kontinentalreisender"],[35,"Erfahrener Reisender"],[50,"Halbe-Hundert-Held"],[75,"Vielflieger"],[100,"Jahrhundert-Reisender"],[150,"Welt-Eroberer"],[195,"Die ganze Welt"]]},
  cities:{label:"Städte",icon:"🏙️",steps:[[1,"Stadtbummler"],[5,"Städtetour"],[10,"Metropolen-Fan"],[25,"Stadt-Sammler"],[50,"Urban Explorer"],[100,"Städte-Profi"],[200,"Großstadt-Legende"]]},
  waters:{label:"Gewässer",icon:"🌊",steps:[[1,"Erste Welle"],[3,"Wasserratte"],[5,"Seefahrer"],[10,"Ozean-Entdecker"],[20,"Meister der Meere"],[35,"Tiefsee-Taucher"],[50,"Neptun persönlich"]]},
  mountains:{label:"Gebirge",icon:"⛰️",steps:[[1,"Erster Gipfel"],[2,"Bergwanderer"],[5,"Gipfelstürmer"],[10,"Höhenflug"],[20,"Bergziege"],[30,"Alpinist"],[50,"Gipfelkönig"]]}
};

/* ---------- Feste Basis der 195 anerkannten Staaten (Block 1) ----------
   193 UN-Mitglieder + Vatikan (VAT) + Palästina (PSE). Fest eingebettet (nicht aus der
   async geladenen Fakten-Quelle), damit Weltabdeckung & Kontinent-Achievements sofort
   und offline korrekt rechnen. ISO-3166-1 alpha-3 Codes. */
const OFFICIAL = new Set([
  // Afrika (54)

  return {users:[{id:uid(),name:"Emil",color:COLORS[0],pass:""},{id:uid(),name:"Lasse",color:COLORS[1],pass:""}],data:{}};
}
function save(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(state)); }
  catch(e){ alert("Speicher voll – evtl. zu viele/zu große Fotos. Letzte Änderung wurde nicht gespeichert."); }

function uid(){ return "u"+Math.random().toString(36).slice(2,9); }
function userData(id){
  if(!state.data[id]) state.data[id]={};
  const d=state.data[id];
  d.countries=d.countries||{}; d.cities=d.cities||[];
  d.waters=d.waters||{}; d.mountains=d.mountains||{};      // angeklickte Karten-Objekte
  d.waterCustom=d.waterCustom||[]; d.mtnCustom=d.mtnCustom||[]; // eigene Einträge
  d.info=d.info||{};
  return d;
}
function counts(id){ const d=userData(id); return {
  countries:Object.keys(d.countries).length,
  cities:d.cities.length,
  waters:Object.keys(d.waters).length+d.waterCustom.length,
  mountains:Object.keys(d.mountains).length+d.mtnCustom.length
}; }

const $=s=>document.querySelector(s);

function renderLogin(){
  const list=$("#userlist"); list.innerHTML="";
  state.users.forEach(u=>{
    const c=counts(u.id);
    const row=document.createElement("div"); row.style.display="flex"; row.style.gap="8px"; row.style.alignItems="center";

    b.innerHTML=`<span class="swatch" style="background:${u.color}"></span><span class="nm">${esc(u.name)} ${u.pass?'🔒':''}</span><span class="meta">${c.countries} Länder</span>`;
    b.onclick=()=>pickUser(u.id);
    const edit=document.createElement("button"); edit.className="iconbtn"; edit.textContent="✏️"; edit.title="Bearbeiten"; edit.onclick=()=>openPersonEdit(u.id);
    row.appendChild(b); row.appendChild(edit);
    list.appendChild(row);
  });
  const cg=$("#colorgrid"); cg.innerHTML="";
  const used=new Set(state.users.map(u=>u.color));

  });
}

function openPasswordPrompt(u,onok){
  openModal(`
    <h2><span class="swatch" style="background:${u.color}"></span> ${esc(u.name)} <span style="margin-left:auto;font-size:16px">🔒</span></h2>

    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="pwCancel">Abbrechen</button>
      <button class="btn" id="pwOk">Anmelden</button>
    </div>`);
  const inp=$("#pwInput"); setTimeout(()=>inp&&inp.focus(),60);
  const submit=()=>{ if(inp.value===u.pass){ closeModal(); onok(); } else { $("#pwErr").style.display="block"; inp.value=""; inp.focus(); } };

function openPersonEdit(id){

  const colors=COLORS.map(c=>`<label><input type="radio" name="ecol" value="${c}" ${c===u.color?'checked':''}><span class="c" style="background:${c}"></span></label>`).join("");
  openModal(`

    <div class="field"><label>Name</label><input type="text" id="eName" value="${esc(u.name)}" maxlength="24"></div>
    <div class="field"><label>Farbe</label><div class="colorgrid">${colors}</div></div>
    <div class="field"><label>Passwort ${u.pass?'(neues setzen oder leer lassen)':'(optional)'}</label><input type="password" id="ePass" placeholder="${u.pass?'•••• unverändert':'kein Passwort'}">
      ${u.pass?'<div class="checkrow" style="margin-top:8px"><input type="checkbox" id="ePassDel"><span>Passwort entfernen</span></div>':''}</div>
    <div class="modal-actions">
      <button class="btn danger" id="eDelete">🗑️ Löschen</button>
      <span class="grow"></span>
      <button class="btn ghost" id="eCancel">Abbrechen</button>
      <button class="btn" id="eSave">Speichern</button>
    </div>`);
  $("#eCancel").onclick=closeModal;
  $("#eSave").onclick=()=>{
    const nm=$("#eName").value.trim(); if(!nm){ $("#eName").focus(); return; }
    u.name=nm;
    u.color=(document.querySelector('input[name=ecol]:checked')||{}).value||u.color;
    const np=$("#ePass").value;
    if($("#ePassDel")&&$("#ePassDel").checked) u.pass="";
    else if(np) u.pass=np;
    save(); closeModal();
    renderLogin();
    if(currentUserId===u.id){ $("#meSwatch").style.background=u.color; $("#meName").textContent=u.name; updateFills(); renderPanel(); }
  };
  $("#eDelete").onclick=()=>{
    if(state.users.length<=1){ alert("Es muss mindestens eine Person geben."); return; }
    if(!confirm(`„${u.name}“ wirklich löschen? Alle Markierungen und Infos dieser Person gehen verloren.`)) return;
    state.users=state.users.filter(x=>x.id!==u.id); delete state.data[u.id]; save();
    if(currentUserId===u.id){ closeModal(); $("#switchUser").click(); renderLogin(); return; }
    closeModal(); renderLogin();
  };
}

  "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson"
];
let baseScale=1;

/* ---------- Länder-Fakten (Hauptstadt, Einwohner, Sprachen, Flagge) ---------- */
let FACTS={};
const FACTS_URLS=[
  "https://cdn.jsdelivr.net/gh/mledoze/countries@master/dist/countries.json",
  "https://raw.githubusercontent.com/mledoze/countries/master/dist/countries.json"
];
async function loadFacts(){
  let arr=null;
  for(const url of FACTS_URLS){ try{ const r=await fetch(url); if(r.ok){ arr=await r.json(); break; } }catch(e){} }
  if(!arr) return;
  arr.forEach(c=>{
    if(!c.cca3) return;
    let cur="";
    if(c.currencies){ const k=Object.keys(c.currencies)[0]; if(k){ const o=c.currencies[k]; cur=(o.name||k)+(o.symbol?` (${o.symbol})`:""); } }
    FACTS[c.cca3]={
      cca2:c.cca2||"",
      capital:(c.capital&&c.capital[0])||"",
      population:c.population||0,
      languages:c.languages?Object.values(c.languages).join(", "):"",
      currency:cur
    };
  });
}
function flagEmoji(cc){ if(!cc||cc.length!==2||cc.includes("-")) return ""; try{ return String.fromCodePoint(...[...cc.toUpperCase()].map(ch=>0x1F1E6+ch.charCodeAt(0)-65)); }catch(e){ return ""; } }
function factsFor(d){
  const p=d.properties||{};
  const f=FACTS[d.id]||{};
  const cca2=f.cca2||p.ISO_A2_EH||p.ISO_A2||"";
  const pop=f.population||p.POP_EST||0;
  return {
    flag:flagEmoji(cca2),
    capital:f.capital||"",
    population:pop>0?pop:null,
    languages:f.languages||"",
    currency:f.currency||""
  };
}
function fmtNum(n){ try{ return new Intl.NumberFormat("de-DE").format(Math.round(n)); }catch(e){ return ""+n; } }

/* ---------- Auswertungen: Kontinente / Weltabdeckung / Chronik (Block 7) ---------- */
let CONTI=null;            // { Kontinent(EN): [alle countryId,...] } – Antarktis & offenes Meer ausgeschlossen
let CONTI_OFFICIAL=null;   // { Kontinent(EN): [nur OFFICIAL-countryId,...] } – Soll-Menge für Vollständigkeit
const CONTI_DE={ "Africa":"Afrika","Asia":"Asien","Europe":"Europa","North America":"Nordamerika","South America":"Südamerika","Oceania":"Ozeanien" };
function buildContinents(){
  CONTI={}; CONTI_OFFICIAL={};
  OFFICIAL_GEO=new Set([...OFFICIAL].map(officialAsGeoId));
  geo.features.forEach(f=>{ const cRaw=(f.properties&&f.properties.CONTINENT)||"?";
    const c=(cRaw==="Antarctica"||cRaw==="Seven seas (open ocean)"||cRaw==="?")?null:cRaw;
    if(c) (CONTI[c]=CONTI[c]||[]).push(f.id);
    if(OFFICIAL_GEO.has(f.id)){ const oc=CONTI_FIX[f.id]||c; if(oc) (CONTI_OFFICIAL[oc]=CONTI_OFFICIAL[oc]||[]).push(f.id); }
  });
  // Validierung: welche offiziellen Codes kommen nicht als Karten-ID vor? (nur warnen, nicht abbrechen)
  const present=new Set(geo.features.map(f=>f.id));
  const missing=[...OFFICIAL_GEO].filter(id=>!present.has(id));
  if(missing.length) console.warn(`[OFFICIAL] ${missing.length} von ${OFFICIAL.size} Staaten nicht als Karten-ID (ADM0_A3) gefunden:`, missing.join(", "));
}
function isOfficialVisited(visited){ return Object.keys(visited).filter(id=>OFFICIAL_GEO&&OFFICIAL_GEO.has(id)).length; }
function coverageStats(uid){ const visited=userData(uid).countries;
  const visOff=isOfficialVisited(visited);
  const pct=Math.min(100,Math.round(visOff/OFFICIAL.size*100));   // Nenner: OFFICIAL.size (195)
  const per=[]; let touched=0, complete=0;
  if(CONTI_OFFICIAL){ for(const cont in CONTI_OFFICIAL){ const ids=CONTI_OFFICIAL[cont]; const vis=ids.filter(id=>visited[id]).length;
    per.push({cont,de:CONTI_DE[cont]||cont,vis,total:ids.length}); if(vis>0) touched++; if(vis===ids.length&&ids.length) complete++; } }
  per.sort((a,b)=> (b.vis/b.total)-(a.vis/a.total) || a.de.localeCompare(b.de));
  return {pct, per, touched, totalCont:Object.keys(CONTI_OFFICIAL||{}).length, complete, visOff, official:OFFICIAL.size};
}
// freitext-Datum grob chronologisch sortierbar machen (Jahr + evtl. Monat)
function dateSortKey(s){ const low=String(s).toLowerCase();
  const y=(low.match(/(19|20)\d{2}/)||[])[0]; if(!y) return Infinity;
  const months={"jänner":1,januar:1,februar:2,"märz":3,maerz:3,april:4,mai:5,juni:6,juli:7,august:8,september:9,oktober:10,november:11,dezember:12};
  let m=0; for(const k in months){ if(low.includes(k)){ m=months[k]; break; } }
  if(!m){ const mm=low.match(/\b(\d{1,2})[.\/]\s*(?:19|20)\d{2}/); if(mm) m=+mm[1]; }
  return (+y)*12 + (m||0);
}
function chronicle(uid){ const info=userData(uid).info, out=[];
  for(const id in info){ const rec=info[id]; if(rec && rec.date){ out.push({id, name:geoName(id), date:rec.date, notes:rec.notes||"", photos:(rec.photos||[]).length, key:dateSortKey(rec.date)}); } }
  out.sort((a,b)=>a.key-b.key); return out;
}

/* Sternenhimmel laden: zuerst eigene Datei, sonst das mitgelieferte stars.svg, sonst CSS-Fallback */
function probeImage(cands,onok,onfail){ let i=0; (function next(){ if(i>=cands.length){ onfail&&onfail(); return; } const im=new Image(); im.onload=()=>onok(cands[i]); im.onerror=()=>{ i++; next(); }; im.src=cands[i]; })(); }
function initSpaceBackground(){
  probeImage(["assets/stars.jpg","assets/stars.jpeg","assets/stars.png","assets/stars.webp","assets/stars.svg"],
    (url)=>{ const s=$("#space"); s.classList.remove("fallback"); s.style.backgroundImage=`url("${url}")`; });
}

async function initMap(){
  let data=null;
  for(const url of GEO_URLS){ try{ const r=await fetch(url); if(r.ok){ data=await r.json(); break; } }catch(e){} }
  if(!data){ $("#loading").innerHTML="Erde konnte nicht geladen werden.<br>Bitte einmal mit Internet öffnen."; return; }
  data.features.forEach((f,i)=>{ const p=f.properties||{}; f.id=p.ADM0_A3||p.ISO_A3_EH||p.ISO_A3||p.ADMIN||("f"+i); });
  geo=data; $("#loading").style.display="none";
  buildContinents();   // Kontinent-Zuordnung aus den Karten-Eigenschaften
  loadFacts(); // im Hintergrund (blockiert die Karte nicht)

  const wrap=$("#mapwrap"); const W=wrap.clientWidth,H=wrap.clientHeight;
  svg=d3.select("#map").attr("viewBox",`0 0 ${W} ${H}`); mapNode=svg.node();
  graticule=d3.geoGraticule10();

  projection=d3.geoOrthographic().rotate([-10,-51]).fitExtent([[24,24],[W-24,H-24]],{type:"Sphere"});
  baseScale=projection.scale();
  pathGen=d3.geoPath(projection);

  { const [tx,ty]=projection.translate(); svg.append("circle").attr("class","glow").attr("cx",tx).attr("cy",ty).attr("r",baseScale+3).attr("id","glowC"); }
  gMap=svg.append("g");
  sphereSel=gMap.append("path").attr("class","sphere");
  gratSel=gMap.append("path").attr("class","graticule");
  countrySel=gMap.selectAll("path.country").data(geo.features).enter().append("path")
    .attr("class","country").attr("data-id",d=>d.id)
    .on("mousemove",(ev,d)=>showTip(ev,d)).on("mouseleave",hideTip)
    .on("click",(ev,d)=>{ if(viewMode!=="map"||panMoved||longPressed) return; toggleCountry(d); })
    .on("contextmenu",(ev,d)=>{ ev.preventDefault(); hideTip(); openCountryInfo(d); });

  // Gebirgs-Relief (nur 2D, Atlas-Look: braune Höhenandeutung unter den Linien)
  reliefLayer=gMap.append("g").attr("id","reliefLayer");
  reliefWide=reliefLayer.selectAll("path.wide").data(mFeatures).enter().append("path").attr("class","relief wide");
  reliefCore=reliefLayer.selectAll("path.core").data(mFeatures).enter().append("path").attr("class","relief core");

  // Flüsse (nur 2D) – breite transparente Trefferlinie + sichtbare Linie
  riverLayer=gMap.append("g").attr("id","riverLayer");
  riverSel=riverLayer.selectAll("path.river").data(rFeatures).enter().append("path").attr("class","river");
  riverHit=riverLayer.selectAll("path.hit").data(rFeatures).enter().append("path").attr("class","hit")
    .on("mousemove",(ev,d)=>showFeatTip(ev,d,"🌊")).on("mouseleave",hideTip)
    .on("click",(ev,d)=>{ if(viewMode!=="map"||panMoved||longPressed) return; toggleRiver(d); });

  // Gebirge (nur 2D)
  mtnLayer=gMap.append("g").attr("id","mtnLayer");
  mtnSel=mtnLayer.selectAll("path.mtn").data(mFeatures).enter().append("path").attr("class","mtn");
  mtnHit=mtnLayer.selectAll("path.hit").data(mFeatures).enter().append("path").attr("class","hit")
    .on("mousemove",(ev,d)=>showFeatTip(ev,d,"⛰️")).on("mouseleave",hideTip)
    .on("click",(ev,d)=>{ if(viewMode!=="map"||panMoved||longPressed) return; toggleMountain(d); });

  // Einzelgipfel (2-Punkt-Linien) zusätzlich als Punkte mit festem Trefferradius (nur 2D)
  const peakFeatures=mFeatures.filter(f=>f.geo.coordinates.length===2);
  peakLayer=gMap.append("g").attr("id","peakLayer");
  peakDot=peakLayer.selectAll("circle.peakdot").data(peakFeatures).enter().append("circle").attr("class","peakdot").attr("r",6);
  peakHit=peakLayer.selectAll("circle.peakhit").data(peakFeatures).enter().append("circle").attr("class","peakhit").attr("r",15)
    .on("mousemove",(ev,d)=>showFeatTip(ev,d,"⛰️")).on("mouseleave",hideTip)
    .on("click",(ev,d)=>{ if(viewMode!=="map"||panMoved||longPressed) return; toggleMountain(d); });

  // Globus-Interaktion: ziehen dreht, ohne Bewegung = Klick = markieren
  let moved=0;
  dragBehavior=d3.drag()
    .on("start",()=>{ moved=0; longPressed=false; svg.classed("grabbing",true); hideTip(); })
    .on("drag",(ev)=>{ moved+=Math.abs(ev.dx)+Math.abs(ev.dy);
      const r=projection.rotate(); const k=70/projection.scale();
      projection.rotate([r[0]+ev.dx*k, clampLat(r[1]-ev.dy*k)]); scheduleRender(); })
    .on("end",(ev)=>{ svg.classed("grabbing",false);
      if(longPressed){ longPressed=false; return; }   // Long-Press hat Info geöffnet, nicht markieren
      if(moved<5){ const pt=d3.pointer(ev.sourceEvent,mapNode); const c=projection.invert(pt);
        if(c){ const f=geo.features.find(ft=>d3.geoContains(ft,c)); if(f) toggleCountry(f); } } });

  // Long-Press (Touch & Maus halten): öffnet Land-Infos in beiden Ansichten, ohne zu markieren
  let lpTimer=null, lpStart=null;
  mapNode.addEventListener("pointerdown",ev=>{
    longPressed=false;
    if(ev.button && ev.button!==0) return;
    if($("#modal").classList.contains("open")) return;
    lpStart=[ev.clientX,ev.clientY]; clearTimeout(lpTimer);
    lpTimer=setTimeout(()=>{ const pt=d3.pointer(ev,mapNode); const c=projection.invert(pt);
      const f=c && geo.features.find(ft=>d3.geoContains(ft,c));
      if(f){ longPressed=true; hideTip(); openCountryInfo(f); } },550);
  });
  mapNode.addEventListener("pointermove",ev=>{ if(lpStart && (Math.abs(ev.clientX-lpStart[0])+Math.abs(ev.clientY-lpStart[1])>8)){ clearTimeout(lpTimer); lpTimer=null; } });
  const lpEnd=()=>{ clearTimeout(lpTimer); lpTimer=null; lpStart=null; };
  mapNode.addEventListener("pointerup",lpEnd);
  mapNode.addEventListener("pointercancel",lpEnd);
  mapNode.addEventListener("pointerleave",lpEnd);

  window.addEventListener("resize",()=>{ setViewMode(viewMode); });

  setViewMode("globe");
  updateFills();
}
function clampLat(p){ return Math.max(-90,Math.min(90,p)); }

/* ---------- Ansicht: Globus <-> 2D-Karte ---------- */
function enableGlobe(){
  svg.on(".zoom",null); zoomBehavior=null;
  gMap.attr("transform",null);
  svg.style("cursor","grab").call(dragBehavior);
  svg.on("wheel.g",(ev)=>{ ev.preventDefault(); const s=projection.scale();
    const ns=Math.max(baseScale*0.7,Math.min(baseScale*7,s*(ev.deltaY<0?1.12:1/1.12)));
    projection.scale(ns); scheduleRender(); },{passive:false});
}
function enableMap(){
  svg.on(".drag",null); svg.on("wheel.g",null); svg.classed("grabbing",false).style("cursor","grab");
  const wrap=$("#mapwrap"), W=wrap.clientWidth, H=wrap.clientHeight;
  zoomBehavior=d3.zoom().scaleExtent([1,14])
    .extent([[0,0],[W,H]]).translateExtent([[0,0],[W,H]])   // Karte bleibt immer im Bild
    .on("start",()=>{ panMoved=false; longPressed=false; hideTip(); })
    .on("zoom",(ev)=>{ if(ev.sourceEvent&&ev.sourceEvent.type==="mousemove") panMoved=true; gMap.attr("transform",ev.transform);
      currentMapK=ev.transform.k; if(peakDot){ peakDot.attr("r",6/currentMapK); peakHit.attr("r",15/currentMapK); } });
  currentMapK=1;
  svg.call(zoomBehavior).call(zoomBehavior.transform,d3.zoomIdentity);
}
function setViewMode(mode){
  if(!svg) return;
  viewMode=mode;
  const wrap=$("#mapwrap"), W=wrap.clientWidth, H=wrap.clientHeight;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  if(mode==="globe"){
    projection=d3.geoOrthographic().rotate([-10,-51]).fitExtent([[24,24],[W-24,H-24]],{type:"Sphere"});
    pathGen=d3.geoPath(projection); baseScale=projection.scale();
    d3.select("#glowC").style("display",null);
    svg.classed("atlas",false);
    $("#space").style.display="";                 // Sternenhimmel zeigen
    reliefLayer.style("display","none"); riverLayer.style("display","none"); mtnLayer.style("display","none"); peakLayer.style("display","none");
    enableGlobe();
    $("#hint").innerHTML=`<b>Ziehen</b> = Globus drehen · <b>Linksklick</b> = Land markieren · <b>Rechtsklick</b> = Infos &amp; Fotos · scrollen zoomt`;
  } else {
    projection=d3.geoNaturalEarth1().fitExtent([[12,12],[W-12,H-12]],{type:"Sphere"});
    pathGen=d3.geoPath(projection); baseScale=projection.scale();
    d3.select("#glowC").style("display","none");
    svg.classed("atlas",true);
    $("#space").style.display="none";             // Sternenhimmel in der 2D-Karte aus
    reliefLayer.style("display",null); riverLayer.style("display",null); mtnLayer.style("display",null); peakLayer.style("display",null);
    enableMap();
    $("#hint").innerHTML=`<b>Ziehen</b> = verschieben · <b>Linksklick</b> = Land / Gebirge / Fluss markieren · <b>Rechtsklick</b> = Land-Infos · scrollen zoomt`;
  }
  $("#toggleView").innerHTML = mode==="globe" ? '🗺️ <span class="lbl">Karte</span>' : '🌍 <span class="lbl">Globus</span>';
  renderGeom(); updateFills();
}

let rafId=null;
function scheduleRender(){ if(rafId) return; rafId=requestAnimationFrame(()=>{ rafId=null; renderGeom(); }); }
function renderGeom(){
  if(!pathGen) return;
  sphereSel.attr("d",pathGen({type:"Sphere"}));
  gratSel.attr("d",pathGen(graticule));
  countrySel.attr("d",pathGen);
  if(riverSel){ const dg=f=>pathGen(f.geo);
    reliefWide.attr("d",dg); reliefCore.attr("d",dg);
    riverSel.attr("d",dg); riverHit.attr("d",dg); mtnSel.attr("d",dg); mtnHit.attr("d",dg); }
  if(peakDot && viewMode==="map"){ const k=currentMapK||1, rd=6/k, rh=15/k;
    const xy=f=>{ const c=f.geo.coordinates; return projection([(c[0][0]+c[1][0])/2,(c[0][1]+c[1][1])/2]); };
    peakDot.attr("cx",f=>xy(f)[0]).attr("cy",f=>xy(f)[1]).attr("r",rd);
    peakHit.attr("cx",f=>xy(f)[0]).attr("cy",f=>xy(f)[1]).attr("r",rh); }
  if(viewMode==="globe"){ const [tx,ty]=projection.translate(); d3.select("#glowC").attr("cx",tx).attr("cy",ty).attr("r",projection.scale()+3); }
}
function updateFills(){
  if(!countrySel) return;
  const me=userById(currentUserId), dd=userData(currentUserId);
  const landDefault = viewMode==="map" ? "#cfe3a8" : "var(--land)";  // Karte: Atlas-Grün · Globus: weiß
  countrySel.style("fill",d=>{
    if(d.id===homeId()) return HOME_COLOR;                 // Heimatland immer Gold
    if(dd.countries[d.id]) return me.color;
    if(showAll){ const v=visitorsOf(d.id);
      if(v.length===1) return d3.color(v[0].color).copy({opacity:.55})+"";
      if(v.length>1) return "#c2ccd6"; }
    return landDefault;
  });
  if(riverSel){
    const wVis=id=>state.users.filter(u=>userData(u.id).waters[id]);
    const mVis=id=>state.users.filter(u=>userData(u.id).mountains[id]);
    // Fluss behält seine blaue Farbe (sonst unsichtbar auf markiertem Land), wird nur dicker + leuchtet.
    // "Alle anzeigen": Fluss leuchtet auch, wenn ihn irgendwer markiert hat.
    riverSel.classed("on",f=> dd.waters[f.id] || (showAll && wVis(f.id).length>0));
    // Gebirge: in Spielerfarbe; bei "Alle anzeigen" in der Farbe der ersten Person, die es markiert hat.
    const mtnStroke=f=>{ if(dd.mountains[f.id]) return me.color; if(showAll){ const v=mVis(f.id); if(v.length) return v[0].color; } return null; };
    mtnSel.classed("on",f=> dd.mountains[f.id] || (showAll && mVis(f.id).length>0)).style("stroke",mtnStroke);
    if(peakDot) peakDot.style("fill",f=>{ if(dd.mountains[f.id]) return me.color; if(showAll){ const v=mVis(f.id); if(v.length) return v[0].color; } return "#7a4f24"; });
  }
}
function countryName(d){ const p=d.properties||{}; return p.NAME_DE||p.NAME||p.NAME_LONG||p.ADMIN||p.name||d.id; }
function visitorsOf(id){ return state.users.filter(u=>userData(u.id).countries[id]); }
function toggleCountry(d){ const cs=userData(currentUserId).countries; if(cs[d.id]) delete cs[d.id]; else cs[d.id]=true; save(); updateFills(); renderPanel(); }
function toggleRiver(f){ const w=userData(currentUserId).waters; if(w[f.id]) delete w[f.id]; else w[f.id]=true; save(); updateFills(); renderPanel(); }
function toggleMountain(f){ const m=userData(currentUserId).mountains; if(m[f.id]) delete m[f.id]; else m[f.id]=true; save(); updateFills(); renderPanel(); }

  $("#iCancel").onclick=()=>{ // neu hinzugefügte, nicht gespeicherte Fotos wieder entfernen
    photoIds.filter(p=>!orig.includes(p) && !String(p).startsWith("data:")).forEach(pdbDel);
    closeModal();
  };
  $("#iSave").onclick=()=>{
    const dd=userData(currentUserId);
    if($("#iVisited").checked) dd.countries[id]=true; else delete dd.countries[id];
    const rec={date:$("#iDate").value.trim(),currency:$("#iCur").value.trim(),notes:$("#iNotes").value.trim(),photos:photoIds};
    if(rec.date||rec.currency||rec.notes||rec.photos.length) dd.info[id]=rec; else delete dd.info[id];
    // entfernte Fotos aus IndexedDB löschen
    orig.filter(p=>!photoIds.includes(p) && !String(p).startsWith("data:")).forEach(pdbDel);
    save(); updateFills(); renderPanel(); closeModal();
  };
}
function fileToThumb(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const max=900; const sc=Math.min(1,max/Math.max(img.width,img.height));
        const cw=Math.round(img.width*sc),ch=Math.round(img.height*sc);
        const c=document.createElement("canvas"); c.width=cw; c.height=ch;
        c.getContext("2d").drawImage(img,0,0,cw,ch);
        res(c.toDataURL("image/jpeg",0.72)); };
      img.onerror=rej; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- Fotos in IndexedDB ----------
   Im state steht pro Foto nur noch eine ID; das Bild (dataURL) liegt in IndexedDB.
   So bleibt localStorage klein und es gibt kein ~5-MB-Limit für Bilder.
   getPhotoURL akzeptiert auch alte base64-Strings (Fallback während/vor der Migration). */
const PDB_NAME="fmwPhotos", PDB_STORE="photos"; let _pdb=null;
function photoDB(){ if(_pdb) return _pdb; _pdb=new Promise((res,rej)=>{ const r=indexedDB.open(PDB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(PDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return _pdb; }
function pdbPut(id,val){ return photoDB().then(d=>new Promise((res,rej)=>{ const tx=d.transaction(PDB_STORE,"readwrite"); tx.objectStore(PDB_STORE).put(val,id); tx.oncomplete=()=>res(id); tx.onerror=()=>rej(tx.error); })); }
function pdbGet(id){ return photoDB().then(d=>new Promise((res,rej)=>{ const tx=d.transaction(PDB_STORE,"readonly"); const q=tx.objectStore(PDB_STORE).get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); })); }
function pdbDel(id){ return photoDB().then(d=>new Promise((res)=>{ const tx=d.transaction(PDB_STORE,"readwrite"); tx.objectStore(PDB_STORE).delete(id); tx.oncomplete=()=>res(); })).catch(()=>{}); }
function photoId(){ return "ph"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
/* Beim Start prüfen, ob IndexedDB wirklich nutzbar ist (öffnen + Testschreibvorgang).
   idbUsable: null=unbekannt, true=ok, false=nicht verfügbar (z.B. privater Modus). */
let idbUsable=null;
async function checkIDB(){
  try{ if(!("indexedDB" in window)) throw new Error("no idb");
    await pdbPut("__idbtest__","ok"); const v=await pdbGet("__idbtest__"); await pdbDel("__idbtest__");
    idbUsable = (v==="ok");
  }catch(e){ idbUsable=false; console.warn("IndexedDB nicht nutzbar – Fotos können nicht gespeichert werden.", e); }
}
function getPhotoURL(ref){
  if(typeof ref==="string" && ref.startsWith("data:")) return Promise.resolve(ref);
  return pdbGet(ref).then(v=>v||"").catch(()=>"");
}
/* Alle referenzierten Fotos aus IndexedDB einsammeln (für Export) */
async function collectPhotos(){ const out={};
  for(const uid in state.data){ const info=(state.data[uid]||{}).info||{};
    for(const cid in info){ for(const ref of (info[cid].photos||[])){
      if(typeof ref==="string" && ref.startsWith("data:")) out[ref]=ref;
      else { const v=await pdbGet(ref); if(v) out[ref]=v; } } } }
  return out;
}
async function restorePhotos(map){ for(const id in map){ try{ await pdbPut(id,map[id]); }catch(e){} } }
/* Einmalige Migration vorhandener base64-Fotos nach IndexedDB (ohne Datenverlust) */
async function migratePhotos(){
  if(state.photosMigrated) return;
  let touched=false;
  for(const uid in state.data){ const info=(state.data[uid]||{}).info||{};
    for(const cid in info){ const rec=info[cid]; if(!rec||!Array.isArray(rec.photos)) continue;
      const ids=[]; for(const ph of rec.photos){
        if(typeof ph==="string" && ph.startsWith("data:")){ const id=photoId(); try{ await pdbPut(id,ph); ids.push(id); touched=true; }catch(e){ ids.push(ph); } }
        else ids.push(ph); }
      rec.photos=ids; } }
  state.photosMigrated=true; save();
  if(touched && currentUserId) renderPanel();
}

/* ---------- Sichern / Laden (Backup) ----------
   Export-Format: { app, version, exportedAt, state, photos }
   - photos wird in Block 2 (IndexedDB) befüllt; aktuell liegen Fotos noch im state. */
const APP_TAG="familien-weltkarte";
const DATA_VERSION=3;
async function exportData(){
  const photos=await collectPhotos();           // {id:dataURL} aus IndexedDB (Block 2)
  const payload={app:APP_TAG,version:DATA_VERSION,exportedAt:new Date().toISOString(),state,photos};
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`familien-weltkarte-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
async function importData(file){
  let obj; try{ obj=JSON.parse(await file.text()); }catch(e){ alert("Die Datei ist kein gültiges JSON."); return; }
  const st = (obj && obj.state) ? obj.state : obj;   // erlaubt auch eine reine state-Datei
  if(!st || !Array.isArray(st.users) || typeof st.data!=="object" || !st.data){
    alert("Die Datei hat nicht das erwartete Format (es fehlen 'users' und 'data')."); return;
  }
  if(!confirm("Aktuelle Daten wirklich durch die Datei ersetzen? Alle lokalen Markierungen werden überschrieben.")) return;
  if(obj.photos) await restorePhotos(obj.photos);    // Fotos in IndexedDB schreiben (Block 2)
  state=st; if(state.photosMigrated===undefined) state.photosMigrated=true;
  normalizeState(); save();
  currentUserId=null; closeModal();
  $("#topbar").style.display="none"; $("#mapwrap").style.display="none"; $("#panel").classList.remove("open");
  loginEl.style.display="flex"; renderLogin();
  alert("Daten erfolgreich geladen.");
}

    <div class="modal-actions"><button class="btn ghost" id="setCancel">Abbrechen</button><button class="btn" id="setSave">Speichern</button></div>`);
  $("#setCancel").onclick=closeModal;
  $("#setSave").onclick=()=>{ state.settings.homeId=$("#setHome").value; save(); updateFills(); renderPanel(); closeModal(); };
}
/* Einstellungen werden über das ⋯-Menü geöffnet (siehe moreMenu-Handler). */

/* ---------- Länder-Suche ---------- */
const searchBox=$("#searchBox"), searchResults=$("#searchResults");
function closeSearch(){ searchResults.classList.remove("open"); searchResults.innerHTML=""; }
// robust über die D3-Datenbindung statt Attribut-Selektor (IDs mit Sonderzeichen/Leerzeichen brechen sonst)
function flashCountry(id){ if(!countrySel) return; const sel=countrySel.filter(d=>d.id===id); if(sel.empty()) return;
  sel.classed("found",true); setTimeout(()=>sel.classed("found",false),2000); }
function animateGlobeTo(toRot,toScale){ const fromR=projection.rotate(), fromS=projection.scale();
  const ivR=d3.interpolate(fromR,toRot), ivS=d3.interpolate(fromS,toScale);
  const t0=performance.now();
  (function tick(now){ const k=Math.min(1,(now-t0)/750), e=d3.easeCubicOut(k);
    projection.rotate(ivR(e)).scale(ivS(e)); renderGeom(); if(k<1) requestAnimationFrame(tick); })(performance.now());
}
function gotoCountry(f){
  closeSearch();
  const [lon,lat]=d3.geoCentroid(f);
  if(viewMode==="globe"){
    // nach dem Drehen moderat heranzoomen, damit auch kleine Inselstaaten sichtbar werden
    animateGlobeTo([-lon,-lat], Math.max(projection.scale(), baseScale*1.8));
  } else { const W=mapNode.clientWidth,H=mapNode.clientHeight, p=projection([lon,lat]);
    const t=d3.zoomIdentity.translate(W/2,H/2).scale(3).translate(-p[0],-p[1]);
    svg.transition().duration(700).call(zoomBehavior.transform,t); }
  setTimeout(()=>flashCountry(f.id), viewMode==="globe"?600:300);
}
if(searchBox){
  searchBox.addEventListener("input",()=>{
    const q=searchBox.value.trim().toLowerCase(); if(!q||!geo){ closeSearch(); return; }
    const matches=geo.features.filter(f=>countryName(f).toLowerCase().includes(q))
      .sort((a,b)=>countryName(a).localeCompare(countryName(b),"de")).slice(0,12);
    if(!matches.length){ searchResults.innerHTML=`<button disabled style="color:#7a8694">Keine Treffer</button>`; searchResults.classList.add("open"); return; }
    searchResults.innerHTML=matches.map(f=>`<button data-go="${f.id}">${esc(countryName(f))}</button>`).join("");
    searchResults.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ const f=geo.features.find(x=>x.id===b.dataset.go); searchBox.value=""; gotoCountry(f); });
    searchResults.classList.add("open");
  });
  searchBox.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const first=searchResults.querySelector("[data-go]"); if(first) first.click(); } else if(e.key==="Escape"){ closeSearch(); searchBox.blur(); } });
  document.addEventListener("click",e=>{ if(!e.target.closest("#searchWrap")) closeSearch(); });
}

/* ---------- helpers ---------- */
function geoName(id){ if(geo){ const f=geo.features.find(x=>x.id===id); if(f) return countryName(f); } return id; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

normalizeState();
checkIDB();             // Verfügbarkeit von IndexedDB einmalig prüfen
migratePhotos();        // alte base64-Fotos einmalig nach IndexedDB verschieben
initSpaceBackground();
renderLogin();
</script>
